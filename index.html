<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="canonical" href="https://playmark0227-svg.github.io/hokkaido/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="ほっかいどう旅手帳 | AIと作る、あなただけの北海道旅プラン" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ほっかいどう旅手帳" />
  <meta name="twitter:description" content="AIと作る、あなただけの北海道旅プラン。" />
  <meta name="twitter:image" content="https://playmark0227-svg.github.io/hokkaido/assets/cover-poster.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.anthropic.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="dns-prefetch" href="//tile.openstreetmap.org" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Klee+One:wght@400;600&family=Yusei+Magic&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <link rel="stylesheet" href="css/style.css?v=20260527j" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,12 88,80 12,80' fill='%23F5C342' stroke='%233D2817' stroke-width='6' stroke-linejoin='round'/%3E%3Cpolygon points='50,12 64,38 36,38' fill='%23FFF9EE' stroke='%233D2817' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ほっかいどう旅手帳",
    "alternateName": "Hokkaido Travel Note",
    "url": "https://playmark0227-svg.github.io/hokkaido/",
    "description": "北海道専門のAIプランナーと対話して旅程を作る観光ポータル",
    "inLanguage": "ja-JP"
  }
  </script>
</head>
<body class="layout-chat">

  <a href="#chat" class="skip-link">本文へスキップ</a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="crayon-rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2"/>
      </filter>
    </defs>
  </svg>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="brand">
          <span class="brand-icon">
            <svg aria-hidden="true" width="44" height="44" viewBox="0 0 100 100">
              <polygon points="50,12 88,80 12,80" fill="#F5C342" stroke="#3D2817" stroke-width="5" stroke-linejoin="round"/>
              <polygon points="50,12 64,38 36,38" fill="#FFF9EE" stroke="#3D2817" stroke-width="3.5" stroke-linejoin="round"/>
              <line x1="50" y1="12" x2="50" y2="4" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
              <polygon points="50,3 68,8 50,13" fill="#E84A38" stroke="#3D2817" stroke-width="2"/>
              <circle cx="76" cy="22" r="6" fill="#E84A38" stroke="#3D2817" stroke-width="2.5"/>
            </svg>
          </span>
          <span class="brand-text">
            <strong>ほっかいどう旅手帳</strong>
            <span>Hokkaido Travel Note</span>
          </span>
        </a>
        <ul class="nav-links">
          <li><a href="index.html" class="active">ホーム</a></li>
          <li><a href="spots.html">観光スポット</a></li>
          <li><a href="business.html">掲載のご案内</a></li>
          <li>
            <button type="button" id="plan-toggle" class="plan-toggle-btn" aria-label="あなたのプランを開く" title="あなたのプラン">
              <span aria-hidden="true">📋</span>
              <span>プラン</span>
              <span class="plan-count is-empty" id="plan-count">0</span>
            </button>
          </li>
          <li>
            <button type="button" id="toggle-map" class="nav-settings" aria-label="マップ表示の切替" title="マップの表示/非表示を切り替え">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ===== Main: Map (left) + Chat (right) ===== -->
  <main class="chat-layout" id="main">

    <aside class="map-panel" id="map-panel" aria-label="北海道マップ">
      <div id="map" role="application" aria-label="北海道の観光スポットが表示されたマップ"></div>
      <div class="map-overlay-legend">
        <span class="legend-title">エリア（色分け）</span>
        <span><span class="dot dot-doo"></span>札幌・小樽・富良野</span>
        <span><span class="dot dot-donan"></span>函館・松前</span>
        <span><span class="dot dot-doto"></span>知床・釧路・網走</span>
        <span><span class="dot dot-dohoku"></span>旭川・稚内・利尻礼文</span>
        <span class="legend-divider"></span>
        <span class="legend-fav"><span class="dot dot-fav"></span>AI提案中</span>
      </div>
    </aside>

    <section class="chat-panel" id="chat" aria-label="AIプランナー">
      <div class="chat-thread" id="chat-thread" role="log" aria-live="polite" aria-atomic="false">

        <!-- Welcome view (replaced once user sends first message) -->
        <div class="chat-welcome" id="chat-welcome">
          <div class="welcome-hero">
            <div class="welcome-emblem" aria-hidden="true">
              <svg width="56" height="56" viewBox="0 0 100 100">
                <polygon points="50,12 88,80 12,80" fill="#F5C342" stroke="#3D2817" stroke-width="5" stroke-linejoin="round"/>
                <polygon points="50,12 64,38 36,38" fill="#FFF9EE" stroke="#3D2817" stroke-width="3.5" stroke-linejoin="round"/>
                <circle cx="76" cy="22" r="6" fill="#E84A38" stroke="#3D2817" stroke-width="2.5"/>
              </svg>
            </div>
            <h1 class="welcome-title">北海道専門のAIプランナー</h1>
            <p class="welcome-sub">行きたい場所・気分・日程を教えてください。<br>あなたにぴったりの旅程をご提案します。</p>
            <p class="welcome-hint">下の例をワンクリックで表示、または下のチャット欄から自由にご相談ください。</p>
          </div>

          <div class="welcome-examples" aria-label="例: クリックすると相談を始めます">
            <button type="button" class="welcome-example" data-prompt="札幌に2泊3日で温泉とグルメを楽しみたい">
              <strong>札幌に2泊3日</strong><span>温泉とグルメを楽しみたい</span>
            </button>
            <button type="button" class="welcome-example" data-prompt="知床と網走で大自然を満喫する3泊プランを組みたい">
              <strong>知床・網走の3泊プラン</strong><span>大自然を満喫したい</span>
            </button>
            <button type="button" class="welcome-example" data-prompt="家族で行ける札幌・小樽周辺のおすすめスポットを教えて">
              <strong>家族で札幌・小樽旅</strong><span>子供連れで楽しめる場所</span>
            </button>
            <button type="button" class="welcome-example" data-prompt="冬の北海道で雪まつりとスキーリゾートを巡りたい">
              <strong>冬の北海道</strong><span>雪まつりとスキーを満喫</span>
            </button>
            <button type="button" class="welcome-example" data-prompt="美瑛と富良野の花と景色を満喫する1泊2日">
              <strong>美瑛・富良野の1泊2日</strong><span>花と景色を満喫</span>
            </button>
            <button type="button" class="welcome-example" data-prompt="函館の夜景と歴史散策の1泊2日プラン">
              <strong>函館の1泊2日</strong><span>夜景と歴史散策</span>
            </button>
          </div>
        </div>

      </div>

      <form class="chat-form" id="chat-form" autocomplete="off">
        <textarea
          id="chat-input"
          class="chat-textarea"
          rows="1"
          placeholder="例: 札幌に2泊で温泉とグルメ、子供連れで…"
          aria-label="AIへの質問を入力"></textarea>
        <button type="submit" id="chat-send" class="chat-send-btn" aria-label="送信">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor" stroke="none"/>
          </svg>
        </button>
      </form>
    </section>

    <!-- ===== Planner panel (always visible on desktop, drawer on mobile) ===== -->
    <aside class="planner-drawer" id="planner-drawer" aria-labelledby="planner-title">
      <div class="planner-head">
        <h2 id="planner-title">あなたのプラン<span class="planner-subtitle">My Itinerary</span></h2>
        <button type="button" id="planner-close" class="planner-close-btn" aria-label="閉じる">×</button>
      </div>
      <div class="planner-body" id="planner-body">
        <!-- Rendered by JS -->
      </div>
      <div class="planner-foot">
        <div class="planner-foot-row planner-foot-primary">
          <button type="button" id="planner-review" class="planner-foot-btn primary" title="AIに今のプランを講評してもらう">🧠 AIに講評</button>
          <button type="button" id="planner-share" class="planner-foot-btn" title="共有リンクをコピー">🔗 共有</button>
          <button type="button" id="planner-print" class="planner-foot-btn" title="印刷・PDF保存">🖨 印刷</button>
        </div>
        <div class="planner-foot-row">
          <button type="button" id="planner-add-day" class="planner-foot-btn">＋ 日を追加</button>
          <button type="button" id="planner-clear" class="planner-foot-btn danger">全クリア</button>
        </div>
      </div>
    </aside>

  </main>

  <!-- Backdrop only used on mobile when drawer is open -->
  <div class="planner-overlay" id="planner-overlay" aria-hidden="true"></div>

  <!-- Print-only area (populated on print) -->
  <div id="print-area" aria-hidden="true"></div>

  <script src="js/config.js?v=20260527j"></script>
  <script src="js/spots.js?v=20260527j"></script>
  <script src="js/icons.js?v=20260527j"></script>
  <script src="js/app.js?v=20260527j"></script>
</body>
</html>
